<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Standard Mark — Indian Standards Recommendation Platform</title>
    <link rel="icon" type="image/png" href="/bis-logo.png" />
    <!-- Type is self-hosted (public/fonts, @font-face in index.css) for offline-first operation -- no external font CDN. -->
  </head>
  <body>
    <!--
      THESIS: Every recommendation is a struck certification seal, not a search-result
      card -- the product's whole job (is this trustworthy, is this certified) rendered
      as the interface itself, refusing the soft-card AI-search-tool default.
      OWN-WORLD: White ground, blue and red sampled directly from the real BIS emblem
      (#0C4DA1, #D51820), a muted gold seal-ring detail; IBM Plex Sans/Mono/Devanagari;
      the emblem itself as the brand mark, circular seal-ring badges (solid=HIGH,
      partial arc=MEDIUM, outline=LOW) as the confidence device; restrained, no neon,
      no rivets, no hard edges, no invented hackathon chrome (utility strap, disclaimer
      line) in the shipped surface.
      STORY: An officer searches in plain language, sees ranked standards as struck
      medallions with an honest confidence ring, opens a seal for QCO/allied/edition
      detail, and copies a GeM clause with confidence.
      FIRST VIEWPORT: Hero headline over a search pill and mode chips, a live-registry
      trust card at right carrying the same seal-ring styling.
      FORM: Standard Mark -- my own top-ranked grounded candidate (roll assigned
      Platform Signage/enamel-plate at index 6; user steered to this pick on "too
      techy" / "comfortable, safe, secured" grounds). Seed key 1aeaa5c9.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the
      finish review, the verdict, DESIGN.md, and every shipping raster carrying its
      provenance.
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
